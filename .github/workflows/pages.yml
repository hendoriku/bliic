name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/wonderful-ptolemy-e4t37p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Font di-host satu origin dengan aplikasi (tanpa urusan CORS). Bila unduhan gagal,
      # CSS otomatis memakai salinan di server Babelii sebagai cadangan.
      - name: Download Captura font
        run: |
          mkdir -p public/fonts
          curl -fsSL --retry 3 -o public/fonts/Captura-Regular.woff2 https://babelii.diofis.net/fonts/Captura-Regular.woff2 \
            && ls -l public/fonts \
            || echo "::warning::Gagal mengunduh font Captura; memakai cadangan dari server Babelii"
      - run: npm run build
        env:
          # Ganti ke "/" setelah memakai domain ibp.diofis.net
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
