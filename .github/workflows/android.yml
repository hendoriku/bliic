name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, claude/wonderful-ptolemy-e4t37p]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Font disertakan di dalam APK (aplikasi tetap tampil benar tanpa memuat dari server).
      - name: Download Captura font
        run: |
          mkdir -p public/fonts
          curl -fsSL --retry 3 -o public/fonts/Captura-Regular.woff2 https://babelii.diofis.net/fonts/Captura-Regular.woff2 \
            && ls -l public/fonts \
            || echo "::warning::Gagal mengunduh font Captura; memakai cadangan dari server Babelii"

      - name: Build web app and sync to Android
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bliic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
